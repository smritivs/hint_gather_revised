# Head-node conda environment for the HINT.GATHER CHIA loop.
#
# This is the env on the machine where you run `chia up` and `chia job submit`
# (the head).  Workers do NOT use it -- the loop ships chia to them via Ray
# py_modules and they run inside the docker images named in cluster.yaml.
#
# In LOCAL mode (HG_LOCAL=1, the single-workstation path documented in
# README.md) there are no workers at all, so this env is the *only* env: it must
# therefore also carry the native build tools the nodes shell out to (cmake,
# ninja, scons, the RISC-V toolchain).
#
# Design notes, learned the hard way from the CHIA examples:
#   * Python is pinned to 3.10.19 to match the CHIA docker images.  Ray
#     serialisation between a 3.13 head and a 3.10 worker will fail.
#   * There is deliberately NO conda `ray` package.  Mixing conda-forge
#     ray/grpcio with pip ray crashes Ray's dashboard agent and breaks
#     `chia job submit` with a 504.  Everything Ray-shaped comes from pip.
#   * `-e ${HG_CHIA_REPO}` is filled in by scripts/setup_env.sh, which rewrites
#     this file into $HG_TOOLS_ROOT/env-resolved.yml with an absolute path.
#     Conda cannot expand environment variables itself.
#
# Create it via:
#   ./scripts/setup_env.sh --only conda

name: hint-gather

channels:
  - conda-forge
  - ucb-bar

dependencies:
  - python=3.10.19
  - pip
  # Native build tooling.  Needed on the head only in LOCAL mode; harmless
  # otherwise.  gem5 needs scons + a C++ toolchain; the LLVM pass plugin needs
  # cmake + ninja; the benchmarks need the bare-metal RISC-V toolchain.
  - cmake>=3.22
  - ninja
  - scons
  - make
  - pkg-config
  - c-compiler=1.5.*     # Conda GCC 12 (isolates from Arch Linux GCC 14/15)
  - cxx-compiler=1.5.*   # Conda G++ 12 + matched libstdc++.so.6
  - lld                  # Fast low-RAM linker (~3 GB vs ~15 GB for gem5.opt)
  - libxml2=2.10.*       # Provides libxml2.so.2 for clang-17 on Arch Linux
  - ncurses              # Provides libtinfo.so.6 for clang-17 on all distros
  - zlib
  - protobuf
  - libpng
  - pip:
      # chia + all its declared deps (ray[default], mcp, pydantic, fastapi,
      # boto3, ...), editable against the local checkout so chia.__path__ points
      # at the source the loop ships via py_modules.
      - -e ${HG_CHIA_REPO}[tensorboard]
      # Ray pulls grpcio transitively, but pin the known-good dashboard-agent
      # compatible build explicitly.  conda-forge grpcio 1.62.2 is NOT enough.
      - grpcio==1.81.0
      # Used by nodes/llvm_nodes.py for stride-entropy scoring and by
      # nodes/evolve.py for the lambda recalibration regression.
      - numpy
